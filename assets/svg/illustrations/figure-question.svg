<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" aria-hidden="true">
  <!-- Person standing with floating question marks (FAQ) -->
  <line x1="20" y1="380" x2="380" y2="380" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M158 220 L242 220 L256 380 L144 380 Z" fill="#0A0A0A"/>

  <!-- Head with curly afro -->
  <g>
    <circle cx="178" cy="138" r="14" fill="#0A0A0A"/>
    <circle cx="200" cy="120" r="18" fill="#0A0A0A"/>
    <circle cx="222" cy="138" r="14" fill="#0A0A0A"/>
    <circle cx="166" cy="156" r="12" fill="#0A0A0A"/>
    <circle cx="234" cy="156" r="12" fill="#0A0A0A"/>
  </g>
  <ellipse cx="200" cy="170" rx="38" ry="38" fill="#FCE7DD" stroke="#0A0A0A" stroke-width="3"/>
  <!-- Eyes (looking up, curious) -->
  <circle cx="188" cy="172" r="3" fill="#0A0A0A"/>
  <circle cx="212" cy="172" r="3" fill="#0A0A0A"/>
  <!-- Eyebrows raised -->
  <line x1="183" y1="163" x2="193" y2="160" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
  <line x1="207" y1="160" x2="217" y2="163" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth (small o, thinking) -->
  <circle cx="200" cy="190" r="3" fill="none" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Arms — one on hip, one scratching head -->
  <path d="M160 232 Q140 260 158 290" fill="none" stroke="#0A0A0A" stroke-width="14" stroke-linecap="round"/>
  <circle cx="158" cy="292" r="9" fill="#FCE7DD" stroke="#0A0A0A" stroke-width="3"/>
  <path d="M242 230 Q280 220 264 180" fill="none" stroke="#0A0A0A" stroke-width="14" stroke-linecap="round"/>
  <circle cx="262" cy="178" r="9" fill="#FCE7DD" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Floating question marks -->
  <g transform="translate(290 80)">
    <circle cx="30" cy="30" r="32" fill="#C0392B"/>
    <text x="30" y="44" text-anchor="middle" font-family="Garet, Inter, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">?</text>
  </g>
  <g transform="translate(70 100)">
    <circle cx="22" cy="22" r="22" fill="#FCE7DD" stroke="#0A0A0A" stroke-width="3"/>
    <text x="22" y="32" text-anchor="middle" font-family="Garet, Inter, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A">?</text>
  </g>
  <g transform="translate(310 220)">
    <circle cx="16" cy="16" r="14" fill="#0A0A0A"/>
    <text x="16" y="22" text-anchor="middle" font-family="Garet, Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">?</text>
  </g>
</svg>
