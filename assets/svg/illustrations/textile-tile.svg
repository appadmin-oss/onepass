<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
  <!-- Bogolan-inspired textile texture: dashes, dots, small crosses, triangles.
       Held back to ~6% opacity in CSS so it reads as fabric, not graphic. -->
  <g fill="#FCB7AB" stroke="none" opacity="1">
    <!-- dashes -->
    <rect x="6"  y="10" width="10" height="2" rx="1"/>
    <rect x="64" y="14" width="10" height="2" rx="1"/>
    <rect x="34" y="46" width="10" height="2" rx="1"/>
    <rect x="6"  y="62" width="10" height="2" rx="1"/>
    <rect x="60" y="60" width="10" height="2" rx="1"/>
    <!-- dots -->
    <circle cx="38" cy="12" r="1.5"/>
    <circle cx="22" cy="32" r="1.5"/>
    <circle cx="54" cy="34" r="1.5"/>
    <circle cx="20" cy="68" r="1.5"/>
    <circle cx="48" cy="72" r="1.5"/>
    <!-- crosses (4-petal) -->
    <g opacity="0.85">
      <rect x="49" y="2"  width="2" height="6"  rx="1"/>
      <rect x="47" y="4"  width="6" height="2"  rx="1"/>
      <rect x="9"  y="42" width="2" height="6"  rx="1"/>
      <rect x="7"  y="44" width="6" height="2"  rx="1"/>
      <rect x="69" y="44" width="2" height="6"  rx="1"/>
      <rect x="67" y="46" width="6" height="2"  rx="1"/>
    </g>
    <!-- small triangles (open) -->
    <g fill="none" stroke="#FCB7AB" stroke-width="1" stroke-linejoin="round">
      <path d="M28 22 L34 22 L31 28 Z"/>
      <path d="M62 26 L68 26 L65 32 Z"/>
      <path d="M14 54 L20 54 L17 60 Z"/>
    </g>
  </g>
</svg>
