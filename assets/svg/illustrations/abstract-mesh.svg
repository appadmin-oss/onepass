<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" class="abstract-pattern" role="img" aria-label="Abstract studio composition">
  <!-- Calm, brand-disciplined: bone background, crimson disc, hairline mesh
       and a peach square cut-out. Reads as "composition" not "stock art". -->
  <defs>
    <linearGradient id="mesh-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#5C0000"/>
    </linearGradient>
    <pattern id="mesh-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(10,10,10,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="#FAFAFA"/>
  <rect width="480" height="480" fill="url(#mesh-grid)"/>
  <rect x="56" y="232" width="180" height="180" fill="#FCE7DD"/>
  <circle cx="320" cy="180" r="120" fill="url(#mesh-d)"/>
  <circle cx="320" cy="180" r="60" fill="#FAFAFA"/>
  <path d="M120 96l84 84M120 180l84-84" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <rect x="280" y="320" width="120" height="20" fill="#0A0A0A"/>
  <rect x="280" y="350" width="80"  height="6"  fill="#0A0A0A" opacity="0.4"/>
  <rect x="280" y="362" width="64"  height="6"  fill="#0A0A0A" opacity="0.25"/>
</svg>
