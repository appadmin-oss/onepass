<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" class="abstract-pattern" role="img" aria-label="Abstract studio composition">
  <!-- Layered crimson, ink and peach orbs — sense of motion without
       any figurative reference. -->
  <defs>
    <radialGradient id="orb-c" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#5C0000"/>
    </radialGradient>
    <radialGradient id="orb-i" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>
  <rect width="480" height="480" fill="#F6F2EC"/>
  <circle cx="120" cy="360" r="160" fill="url(#orb-c)"/>
  <circle cx="360" cy="120" r="120" fill="url(#orb-i)"/>
  <circle cx="240" cy="240" r="64"  fill="#FCE7DD"/>
  <path d="M40 240Q240 60 440 240" stroke="#0A0A0A" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="120" cy="360" r="160" fill="none" stroke="#FAFAFA" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
</svg>
