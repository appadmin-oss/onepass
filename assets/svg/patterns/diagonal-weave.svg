<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Diagonal weave pattern">
  <!-- Cross-hatch weave abstracted from West African strip-woven cloth
       without copying kente directly. Three densities of stroke at
       45° create the illusion of woven warp + weft. Tile is small
       (80×80) so it scales to dense or sparse with the host's
       background-size override. -->
  <g fill="none" stroke="currentColor" opacity="0.12">
    <g stroke-width="0.8">
      <line x1="-10" y1="10"  x2="90" y2="-90"/>
      <line x1="-10" y1="20"  x2="90" y2="-80"/>
      <line x1="-10" y1="30"  x2="90" y2="-70"/>
      <line x1="-10" y1="40"  x2="90" y2="-60"/>
      <line x1="-10" y1="50"  x2="90" y2="-50"/>
      <line x1="-10" y1="60"  x2="90" y2="-40"/>
      <line x1="-10" y1="70"  x2="90" y2="-30"/>
      <line x1="-10" y1="80"  x2="90" y2="-20"/>
      <line x1="-10" y1="90"  x2="90" y2="-10"/>
    </g>
    <g stroke-width="0.8">
      <line x1="-10" y1="-10" x2="90" y2="90"/>
      <line x1="-10" y1="0"   x2="90" y2="100"/>
      <line x1="-10" y1="10"  x2="90" y2="110"/>
      <line x1="-10" y1="20"  x2="90" y2="120"/>
      <line x1="-10" y1="30"  x2="90" y2="130"/>
      <line x1="-10" y1="40"  x2="90" y2="140"/>
    </g>
  </g>
  <!-- accent thread: one thicker, slightly more opaque crossing line -->
  <line x1="-10" y1="40" x2="90" y2="40" stroke="currentColor" stroke-width="2" opacity="0.10"/>
</svg>
