<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Arched-light pattern">
  <!-- "Sun through the colonnade" — a horizon line plus a sequence of
       partial circles peeking above it. Inspired by the silhouette of
       Hassan II's archways and the courtyard arcades you find from
       Marrakesh to Mombasa, but reduced to geometric primitives so
       the motif reads as light + structure, not architecture. Tiles
       horizontally with seamless arch repetition. -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.16">
    <!-- horizon -->
    <line x1="0" y1="160" x2="200" y2="160"/>
    <!-- shadow horizon (hairline echo) -->
    <line x1="0" y1="180" x2="200" y2="180" stroke-dasharray="3 8"/>
    <!-- arches (only the upper hemicircle, sitting on the horizon) -->
    <path d="M0 160 A 40 40 0 0 1 80  160" />
    <path d="M80 160 A 40 40 0 0 1 160 160" />
    <path d="M160 160 A 40 40 0 0 1 240 160" />
    <!-- inner arches, smaller, for rhythm -->
    <path d="M20 160 A 20 20 0 0 1 60  160" />
    <path d="M100 160 A 20 20 0 0 1 140 160" />
    <path d="M180 160 A 20 20 0 0 1 220 160" />
  </g>
  <!-- a single sun-glyph above, low-contrast -->
  <circle cx="100" cy="50" r="22" fill="currentColor" opacity="0.06"/>
  <circle cx="100" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="1" opacity="0.16"/>
</svg>
